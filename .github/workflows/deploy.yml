# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::770018310906:role/rentatodo-github-actions
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: rentatodo-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$REPOSITORY:latest \
            .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: rentatodo-api
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region us-east-1 \
            --targets '[{"Key":"tag:Name","Values":["rentatodo-api"]}]' \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"DATABASE_URL=\$(aws ssm get-parameter --name /rentatodo/database_url --with-decryption --query Parameter.Value --output text --region us-east-1)\",
              \"JWT_SECRET=\$(aws ssm get-parameter --name /rentatodo/jwt_secret --with-decryption --query Parameter.Value --output text --region us-east-1)\",
              \"CORS_ORIGINS=\$(aws ssm get-parameter --name /rentatodo/cors_origins --query Parameter.Value --output text --region us-east-1)\",
              \"aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $REGISTRY/$REPOSITORY:latest\",
              \"docker stop rentatodo-api 2>/dev/null || true\",
              \"docker rm rentatodo-api 2>/dev/null || true\",
              \"docker run -d --name rentatodo-api --restart=always -e DATABASE_URL=\\\"\$DATABASE_URL\\\" -e JWT_SECRET=\\\"\$JWT_SECRET\\\" -e CORS_ORIGINS=\\\"\$CORS_ORIGINS\\\" -e JWT_EXPIRATION_HOURS=24 -e AWS_S3_BUCKET=rentatodo-items -e AWS_S3_REGION=us-east-1 -p 8000:8000 $REGISTRY/$REPOSITORY:latest\",
              \"sleep 5 && docker ps -q -f name=rentatodo-api -f status=running | grep -q . || (echo 'Container failed to start' >&2 && exit 1)\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait up to 3 minutes for the deploy to finish.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id $(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=rentatodo-api" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text) \
            --region us-east-1

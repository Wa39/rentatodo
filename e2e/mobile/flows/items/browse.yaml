# Browse items on home screen — search + filter segments.
# Requires 7 seeded items (infra/seed.py).
# Run: maestro test e2e/mobile/flows/items/browse.yaml

appId: host.exp.Exponent
---
- launchApp
- assertVisible:
    id: "login-brand"
- tapOn:
    id: "login-email"
- inputText:
    text: "renter@rentatodo.dev"
- tapOn:
    id: "login-password"
- inputText:
    text: "Rentatodo2026!"
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "home-title"
- tapOn:
    id: "home-search"
- inputText:
    text: "bicicleta"
- assertVisible: "Bicicleta de montaña Trek"

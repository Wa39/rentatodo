# Happy-path registration — uses a timestamped email to avoid duplicates.
# Run: maestro test e2e/mobile/flows/auth/register.yaml

appId: host.exp.Exponent
---
- launchApp
- assertVisible: "RentaTodo"
- tapOn:
    id: "login-to-register"
- assertVisible: "Solo se necesita nombre, correo y contraseña"
- tapOn:
    id: "register-name"
- inputText:
    text: "Test User"
- tapOn:
    id: "register-email"
- inputText:
    text: "test+${maestro.timestamp}@rentatodo.dev"
- tapOn:
    id: "register-password"
- inputText:
    text: "Rentatodo2026!"
- tapOn:
    id: "register-submit"
- assertVisible:
    id: "tab-home"
- assertVisible:
    id: "tab-rentals"
- assertVisible:
    id: "tab-profile"
